# Android / web の両対応を壊さないためのCI。
#
# **端末が要る段（Androidの integration_test）はCIでは回さない。**
# それはローカルの tool/test_matrix.ps1 の担当（実機縛りのため）。
# ここは「片方のプラットフォームだけ壊す変更」を最短で検出するためのゲート。
#
# web の integration_test はブラウザさえあれば回るので、ここで回している。
# `flutter build web` は通っても実行時に落ちうる（`dart:io` が
# 「コンパイルは通るが呼ぶと落ちるスタブ」として出るため）ので、
# コンパイルゲートだけでは足りない。
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# ⚠ 生成コード（`*.g.dart`）は .gitignore 済みなので、CIには存在しない。
#    どのジョブも `flutter pub get` のあとに codegen を回すこと。
#    忘れると `Undefined name 'Translations'` のような分かりにくい形で落ちる
#    （2026-08-26 まで4ジョブ全部がこれで落ちていた）。
env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  analyze-and-unit:
    name: analyze + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # ⚠ `dart run slang` を先に回さない。build_runner 2.16 以降は自分が作っていない
      #    strings*.g.dart があると Asset already exists で落ちる（i18n も build_runner が作る）
      - name: コード生成（riverpod + i18n）
        run: dart run build_runner build --delete-conflicting-outputs
      # pubspec の assets にあるシェーダ束はビルド時に hook/build.dart が作るので、analyze の時点では無い
      # （asset_does_not_exist の warning で落ちる。2026-09-13 から）。無ければ空で置き、ビルドやテストで hook が上書きする
      - name: シェーダ束の仮置き（analyze 用）
        run: mkdir -p build/shaderbundles && [ -f build/shaderbundles/terrain.shaderbundle ] || touch build/shaderbundles/terrain.shaderbundle
      - run: flutter analyze
      # geodiff（行単位マージ）のホスト VM テスト用に Linux 版を焼く（third_party/geodiff/README.md）
      - name: geodiff を焼く（Linux）
        run: bash third_party/geodiff/build_linux.sh
      - run: flutter test

  build-web:
    name: build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # ⚠ `dart run slang` を先に回さない。build_runner 2.16 以降は自分が作っていない
      #    strings*.g.dart があると Asset already exists で落ちる（i18n も build_runner が作る）
      - name: コード生成（riverpod + i18n）
        run: dart run build_runner build --delete-conflicting-outputs
      # web版が「コンパイルすら通らない」状態に戻るのを防ぐゲート。
      # 実行時の振る舞いは下の e2e-web が見る。
      - run: flutter build web --release

  e2e-web:
    name: e2e (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # ⚠ `dart run slang` を先に回さない。build_runner 2.16 以降は自分が作っていない
      #    strings*.g.dart があると Asset already exists で落ちる（i18n も build_runner が作る）
      - name: コード生成（riverpod + i18n）
        run: dart run build_runner build --delete-conflicting-outputs
      # ubuntu-latest には Chrome と chromedriver が同梱されている。
      # バージョンずれで落ちたときはここを見ること。
      - name: chromedriver のバージョンを記録
        run: |
          google-chrome --version
          chromedriver --version
      - name: chromedriver を起動
        run: chromedriver --port=4444 &
      # integration_test/ を1本ずつ回す（ディレクトリ指定は2本目以降が
      # 起動に失敗する。tool/test_matrix.ps1 と同じ理由）。
      - name: integration_test を Chrome で実行
        run: |
          for f in integration_test/*_test.dart; do
            echo "--- $f ---"
            flutter drive               --driver=test_driver/integration_test.dart               --target="$f"               -d web-server --browser-name=chrome --driver-port=4444
          done

  build-android:
    name: build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # ⚠ `dart run slang` を先に回さない。build_runner 2.16 以降は自分が作っていない
      #    strings*.g.dart があると Asset already exists で落ちる（i18n も build_runner が作る）
      - name: コード生成（riverpod + i18n）
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --debug
