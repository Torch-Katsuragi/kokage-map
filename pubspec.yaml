name: root_maps
description: "こかげマップ - 林業向けGIS地図アプリケーション"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.6.1+18

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:                # 標準ウィジェットのローカライズ（戻るボタン等）
    sdk: flutter
  slang: ^4.5.0                         # i18n: 型安全な翻訳コード生成
  slang_flutter: ^4.5.0                 # i18n: Flutter統合（TranslationProvider等）
  flutter_riverpod: ^3.0.3 # 状態管理 (v3 + code generation)
  riverpod_annotation: ^4.0.0 # @riverpod アノテーション
  latlong2: ^0.9.0 # 緯度経度座標型（maplibre 移行後も座標型として使い続けている）
  geolocator: ^14.0.0 # GPS位置情報取得
  file_picker: ^11.0.0 # ファイル・ディレクトリ選択用（最新版に更新）
  file_selector: ^1.0.3 # 新しいファイル選択・保存ダイアログ用
  sqflite: ^2.3.0 # GeoPackageファイル操作用（sqlite3から移行）
  sqflite_common_ffi_web: ^1.1.1     # web版: sqlite3 WASM でGeoPackageを開く
  path: ^1.8.3 # パス操作用
  xml: ^6.6.1 # .qgs（QGISプロジェクト）の組み立て用
  archive: ^4.0.9 # .qgz（zip 形式の QGIS プロジェクト）の読み取り用
  nmea: ^3.3.3
  proj4dart: ^2.1.0  # 座標変換用（geobase ^1.5.0 が ^2.0.0 を要求するため据え置き）
  desktop_drop: ^0.7.0  # デスクトップでのファイルドラッグ&ドロップ用
  charset_converter: ^2.3.0  # Shift_JIS等の文字コード変換用（ネイティブAPI使用）
  charset: ^2.0.1  # 純粋Dart実装の文字コード変換（Shift-JIS, EUC-JP対応）
  
  # オフライン機能・キャッシュ用パッケージ
  path_provider: ^2.1.4              # アプリディレクトリ取得用
  shared_preferences: ^2.3.2         # 設定保存用
  crypto: ^3.0.7                     # ハッシュ化用
  http: ^1.2.2                       # HTTP通信用（背景地図ダウンロード）
  image: ^4.2.0                      # 画像処理用（タイル切り出し・スケーリング）
  
  # Bluetooth GNSS接続用パッケージ
  flutter_bluetooth_serial: ^0.4.0  # Bluetooth Classic接続用
  permission_handler: ^12.0.0       # Androidパーミッション管理用
  location: ^8.0.0                  # Mock location provider用
  
  # バックグラウンドサービス用パッケージ
  flutter_background_service: ^5.0.9  # フォアグラウンド・バックグラウンドタスク実行用
  
  # コンパス・センサー用パッケージ
  flutter_compass: ^0.8.0             # コンパス（磁気センサー）データ取得用
  sensors_plus: ^7.0.0                # 加速度計データ取得用（水準器機能）

  # 属性テーブル表示・編集用パッケージ
  trina_grid: ^2.2.1                  # 高機能データグリッド（属性テーブル用、TrinaGrid後継）

  # コレクション操作用パッケージ
  
  # 地理空間計算用パッケージ
  turf: ^0.0.10                       # GeoJSONベースの地理空間分析ライブラリ

  # 写真・画像関連パッケージ
  photo_view: ^0.15.0                 # 画像ビューアー（ズーム・パン対応、全プラットフォーム対応）

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.0.0
  flex_color_picker: ^3.7.2
  url_launcher: ^6.3.2              # 外部URL起動用
  
  # Google Drive連携用パッケージ
  google_sign_in: ^7.0.0            # Google OAuth認証用
  google_sign_in_web: ^1.1.0        # webのサインインボタン（renderButton）を直接使う
  googleapis: ^16.0.0               # Google APIs（Drive API含む）
  extension_google_sign_in_as_googleapis_auth: ^3.0.0  # google_sign_inとgoogleapisの連携
  # flutter_secure_storage: 削除（lib/内で未使用、win32バージョン競合の原因）
  mobile_scanner: ^7.1.4
  package_info_plus: ^9.0.0         # win32 ^5 vs ^6 競合のため据え置き
  maplibre: ^0.3.5
  # ⚠ maplibre_webview（デスクトップのWebView実装）は 2026-08-25 に外した。
  #    デスクトップ版の撤去にあわせて不要になり、推移的に入っていた
  #    flutter_inappwebview も Android APK から落ちる。
  supercluster: ^3.2.0
  geobase: ^1.5.0
  exif: ^3.3.0
  audioplayers: ^6.6.0
  flutter_markdown: ^0.7.6              # CHANGELOG.md表示用
  markdown: ^7.0.0                         # カスタムMarkdownシンタックス用
  device_info_plus: ^12.4.0         # win32 ^5 vs ^6 競合のため据え置き
  firebase_core: ^4.11.0
  firebase_database: ^12.4.4
  firebase_auth: ^6.5.4
  battery_plus: ^7.1.0
  firebase_app_check: ^0.4.5
  web: ^1.1.0                       # web版のFile System Access API（js_interop）
  qr_flutter: ^4.1.0                    # Drive連携フォルダのQRコード表示（スキャン側は mobile_scanner）


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:                     # 実機/エミュ統合テスト（位置共有のRTDB往復検証）
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.25.15
  # ホストVMのユニットテストで sqflite を動かすために要る
  # （アプリ本体はモバイル=標準実装 / web=ffi_web なので、これはテスト専用）。
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^4.0.0 # @riverpod コード生成
  slang_build_runner: ^4.5.0 # i18n: slangコード生成用
  build_runner: ^2.13.0 # コード生成実行用（slang_build_runner 4.14のbuild_to対応に2.13+必要）

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/changelog/
    - assets/user_guide/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
